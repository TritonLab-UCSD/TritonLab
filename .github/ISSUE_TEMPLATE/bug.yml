name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [high - blocks users, medium - degraded, low - cosmetic]
    validations:
      required: true
